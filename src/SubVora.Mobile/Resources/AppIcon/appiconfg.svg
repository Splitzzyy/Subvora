<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    SubVora app-icon foreground: a clockwise renewal-cycle ring (the recurring charge) enclosing three
    ascending bars (the burn rate). White only - the purple comes from the MauiIcon Color attribute,
    which is also what paints the Android adaptive-icon background layer.

    Everything sits inside a 256px circle centred in the 456px canvas, so it survives the Android
    adaptive-icon mask, which crops anything outside the inner ~66% of the canvas.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Cycle ring: 300deg arc, gap at the top where the arrowhead points back into it. The arrowhead's
         base sits 10px back along the arc rather than flush with its cap - two white shapes that merely
         abut leave a semi-transparent antialiasing seam, which shows up as a hairline at icon sizes. -->
    <path d="M 280,137.94 A 104,104 0 1 1 176,137.94" fill="none" stroke="#ffffff" stroke-width="24" />
    <path d="M 201.98,122.94 L 178.34,161.99 L 156.34,123.89 Z" fill="#ffffff" />

    <!-- Burn-rate bars, ascending left to right. -->
    <path d="M 180.5,250 H 193.5 A 7,7 0 0 1 200.5,257 V 285 A 7,7 0 0 1 193.5,292 H 180.5 A 7,7 0 0 1 173.5,285 V 257 A 7,7 0 0 1 180.5,250 Z" fill="#ffffff" />
    <path d="M 221.5,222 H 234.5 A 7,7 0 0 1 241.5,229 V 285 A 7,7 0 0 1 234.5,292 H 221.5 A 7,7 0 0 1 214.5,285 V 229 A 7,7 0 0 1 221.5,222 Z" fill="#ffffff" />
    <path d="M 262.5,194 H 275.5 A 7,7 0 0 1 282.5,201 V 285 A 7,7 0 0 1 275.5,292 H 262.5 A 7,7 0 0 1 255.5,285 V 201 A 7,7 0 0 1 262.5,194 Z" fill="#ffffff" />
</svg>
