services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: subvora_dev
      POSTGRES_USER: subvora
      POSTGRES_PASSWORD: subvora_dev_password
    ports:
      - "5433:5432"
    volumes:
      - subvora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subvora -d subvora_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/SubVora.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      # Matches the throwaway credentials on the db service above; safe to inline for the same
      # reason those are - this compose file is local development only.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=subvora_dev;Username=subvora;Password=subvora_dev_password"
      # Never inlined: a signing secret in a tracked file lets anyone with repo read access mint a
      # token for any user. Supply it from your shell or an untracked .env; compose fails here if
      # it is unset, and the API fails at startup if it is blank.
      Jwt__Secret: "${SUBVORA_JWT_SECRET:?set SUBVORA_JWT_SECRET (e.g. openssl rand -base64 48) before docker compose up}"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  subvora_pg_data:
