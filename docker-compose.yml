services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: subvora_dev
      POSTGRES_USER: subvora
      POSTGRES_PASSWORD: subvora_dev_password
    ports:
      - "5433:5432"
    volumes:
      - subvora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subvora -d subvora_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reads reset codes and already-registered notices that would otherwise go nowhere locally.
  # Inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      # 8025 is the inbox. 1025 is published too so `dotnet run` on the host can reach SMTP at
      # localhost:1025 - the same address appsettings.Development.json already uses.
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: .
      dockerfile: src/SubVora.Api/Dockerfile
    restart: unless-stopped
    environment:
      # Stays Docker, not Development: Program.cs skips UseHttpsRedirection only for this
      # environment, and the container has no HTTPS port to redirect to.
      ASPNETCORE_ENVIRONMENT: Docker
      # The only two settings that cannot be shared, and neither is a secret. Inside a container
      # localhost is the container, so the host-side addresses in the mounted file are wrong here.
      # The database password is the throwaway one already spelled out on the db service above.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=subvora_dev;Username=subvora;Password=subvora_dev_password"
      Smtp__Host: mailpit
    volumes:
      # One config file for both `dotnet run` and Docker, mounted under the name this environment
      # loads. Sharing it means the signing key is defined once, so a token minted by one is
      # accepted by the other. Gitignored, and mounted rather than baked in so it never lands in an
      # image layer; read-only so the container cannot rewrite it.
      #
      # Copy appsettings.Development.example.json to create it *before* the first `up` - without
      # the file Docker will helpfully create a *directory* here and the API will fail to start.
      - ./src/SubVora.Api/appsettings.Development.json:/app/appsettings.Docker.json:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  subvora_pg_data:
