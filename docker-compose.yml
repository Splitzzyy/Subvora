services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: subvora_dev
      POSTGRES_USER: subvora
      POSTGRES_PASSWORD: subvora_dev_password
    ports:
      - "5433:5432"
    volumes:
      - subvora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subvora -d subvora_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reads reset codes and already-registered notices that would otherwise go nowhere locally.
  # Inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: src/SubVora.Api/Dockerfile
    restart: unless-stopped
    environment:
      # Not a secret - it only selects which appsettings file is layered on top.
      ASPNETCORE_ENVIRONMENT: Docker
    volumes:
      # Every secret lives in this file, which is gitignored. Mounted rather than baked into the
      # image so it never lands in a layer, and read-only so the container cannot rewrite it.
      # Copy appsettings.Docker.example.json to create it - without the file Docker will helpfully
      # create a *directory* here and the API will fail to start on a missing connection string.
      - ./src/SubVora.Api/appsettings.Docker.json:/app/appsettings.Docker.json:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  subvora_pg_data:
