# Render blueprint for the SubVora API. See docs/DEPLOYMENT.md for the one-time provisioning
# steps this file assumes have already happened (database migrated, SMTP sender verified).
services:
  - type: web
    name: subvora-api
    runtime: docker
    plan: free
    region: oregon

    # The Dockerfile does `COPY src/ src/`, so the build context has to be the repo root.
    dockerfilePath: ./src/SubVora.Api/Dockerfile
    dockerContext: .

    # Liveness only - deliberately not /health, which probes Postgres. Render polls this path
    # continuously for the life of the service, and Neon's free tier bills compute and scales to
    # zero when idle, so a database-touching check here holds that compute awake around the clock
    # (the same reasoning DEPLOYMENT.md gives for pointing the keep-warm ping at / instead).
    # It is also the right semantics: a failed check restarts the instance, and a database blip
    # should not restart a healthy app. /health and /health/ready still include the probe.
    healthCheckPath: /health/live

    # Deploys are triggered by .github/workflows/db-migrate.yml, after that workflow has applied
    # migrations - not by the push itself. With autoDeploy on, a push carrying a migration shipped
    # the code first and changed the schema only if someone remembered to run the workflow by hand.
    # Now a failed migration simply never fires the deploy hook, and the previous release keeps
    # serving on the schema it was built for.
    autoDeploy: false

    envVars:
      # Not "Docker": that environment name makes Program.cs migrate on boot and publish Swagger.
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Matches the PORT Render injects, so it never has to guess from EXPOSE.
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"

      # sync: false means "prompt me, store it encrypted, keep it out of this file".
      - key: ConnectionStrings__Default
        sync: false
      # Must be at least 32 UTF-8 bytes or startup throws. `openssl rand -base64 48`.
      - key: Jwt__Secret
        sync: false

      - key: Smtp__Host
        value: smtp-relay.brevo.com
      - key: Smtp__Port
        value: "587"
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__FromAddress
        sync: false
