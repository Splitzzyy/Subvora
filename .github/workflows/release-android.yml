name: Release Android APK

# The React Native client in Android/ - the successor to the retired MAUI client. It ships under
# the MAUI app's application id (com.subvora.mobile) and is signed with the same keystore, so a
# phone with the MAUI app installed upgrades to it in place.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci

      # base64 -d, not -di: a secret that picked up stray characters must fail here, not as an opaque
      # signing error minutes later.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/subvora-release.keystore"

      # Names the bad secret in seconds. Whitespace is checked separately because it is invisible:
      # piping into `gh secret set` keeps the trailing newline, while the interactive prompt trims it.
      - name: Verify signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_ALIAS; do
            value="${!name}"
            [ -n "$value" ] || { echo "::error::ANDROID_$name is empty in the production environment."; exit 1; }
            [ "$value" = "$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" ]               || { echo "::error::ANDROID_$name contains whitespace - re-set it via the interactive prompt."; exit 1; }
          done
          echo "$KEYSTORE_PASSWORD" | keytool -list -keystore "$RUNNER_TEMP/subvora-release.keystore" -alias "$KEY_ALIAS"

      # android/ is generated (Continuous Native Generation) and gitignored. versionCode is this
      # workflow's run number, which continued from the MAUI releases (v1.3.0 shipped versionCode 7).
      # Android refuses an upgrade to an equal or lower versionCode, so the floor is enforced here:
      # renaming or recreating this workflow file restarts run_number at 1, and that must fail the
      # build, not users' upgrades.
      - name: Generate native project
        env:
          LAST_MAUI_VERSION_CODE: 7
        run: |
          if [ "$GITHUB_RUN_NUMBER" -le "$LAST_MAUI_VERSION_CODE" ]; then
            echo "::error::versionCode $GITHUB_RUN_NUMBER would not upgrade MAUI installs (last: $LAST_MAUI_VERSION_CODE). Add an offset."
            exit 1
          fi
          npx expo prebuild --platform android --no-install
          sed -i -e "s/versionCode [0-9]*$/versionCode ${GITHUB_RUN_NUMBER}/" \
                 -e "s/versionName \"[^\"]*\"/versionName \"${GITHUB_REF_NAME#v}\"/" android/app/build.gradle
          grep -q "versionCode ${GITHUB_RUN_NUMBER}$" android/app/build.gradle \
            && grep -q "applicationId 'com.subvora.mobile'" android/app/build.gradle \
            || { echo "::error::Generated build.gradle lacks the expected applicationId/versionCode."; grep -n "applicationId\|versionCode\|versionName" android/app/build.gradle; exit 1; }

      # EXPO_PUBLIC_API_URL is left unset on purpose: the client defaults to the deployed API.
      # Phones only - the emulator ABIs would roughly double the APK.
      - name: Build release APK
        working-directory: Android/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # The generated project signs release builds with the debug key; apksigner replaces that
      # signature with the production one.
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/subvora-release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/SubVora-${GITHUB_REF_NAME}.apk" \
            android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$RUNNER_TEMP/SubVora-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/SubVora-${GITHUB_REF_NAME}.apk" --clobber
