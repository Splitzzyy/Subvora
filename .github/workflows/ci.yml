name: CI

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test API project
        run: dotnet test tests/SubVora.Api.Tests/SubVora.Api.Tests.csproj -c Release

      - name: Test Application project
        run: dotnet test tests/SubVora.Application.Tests/SubVora.Application.Tests.csproj -c Release

      - name: Test Infrastructure project
        run: dotnet test tests/SubVora.Infrastructure.Tests/SubVora.Infrastructure.Tests.csproj -c Release

  # The React Native client in Android/ - the only mobile client built anywhere. The production JS
  # bundle (Hermes) is compiled here; the signed native APK comes from release-android.yml.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Android/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
