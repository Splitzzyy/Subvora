name: Release Android APK (React Native)

# Separate tag prefix from release-android.yml (v*), so the MAUI and React Native clients can be
# released independently while both exist.
on:
  push:
    tags: ["rn-v*"]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Same environment and secret names as release-android.yml, so one keystore signs both apps.
    environment: production
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci

      # Strict decode for the reason release-android.yml gives: a corrupted secret should fail here,
      # not as an opaque signing error later.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/subvora-release.keystore"

      - name: Verify signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_ALIAS; do
            [ -n "${!name}" ] || { echo "::error::ANDROID_$name is empty in the production environment."; exit 1; }
          done
          echo "$KEYSTORE_PASSWORD" | keytool -list -keystore "$RUNNER_TEMP/subvora-release.keystore" -alias "$KEY_ALIAS"

      # android/ is generated (Continuous Native Generation) and gitignored. Version code must rise
      # monotonically for in-place upgrades, so it comes from the run number like the MAUI release.
      - name: Generate native project
        run: |
          npx expo prebuild --platform android --no-install
          sed -i -e "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" \
                 -e "s/versionName \"1.0.0\"/versionName \"${GITHUB_REF_NAME#rn-v}\"/" android/app/build.gradle

      # EXPO_PUBLIC_API_URL is left unset on purpose: the client defaults to the deployed API.
      # Phones only - the emulator ABIs would roughly double the APK.
      - name: Build release APK
        working-directory: Android/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # The generated project signs release builds with the debug key; apksigner replaces that
      # signature with the production one.
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/subvora-release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/SubVora-${GITHUB_REF_NAME}.apk" \
            android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$RUNNER_TEMP/SubVora-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/SubVora-${GITHUB_REF_NAME}.apk" --clobber
